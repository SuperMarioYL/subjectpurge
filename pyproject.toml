[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subjectpurge"
version = "0.1.0"
description = "清痕 — per-subject deletion-lineage mapper across agent-memory stores (SQLite / Chroma / trace) with 等保2.0 audit proof. 数据不出境."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "SuperMarioYL" }]
keywords = [
    "privacy",
    "pii",
    "deletion",
    "pipl",
    "gdpr",
    "ccpa",
    "agent-memory",
    "dengbao",
    "compliance",
    "audit",
    "data-lineage",
    "reverse-delete",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12,<1.0",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
# Chroma vector adapter — heavy native deps; opt-in so the core installs anywhere.
chroma = ["chromadb>=0.5,<2"]
# Audit signer (m3) — ed25519 + 等保2.0 report template. Stubbed in m1.
audit = ["cryptography>=42,<46", "jinja2>=3.1,<4"]
all = ["subjectpurge[chroma,audit]"]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.5",
]

[project.scripts]
subjectpurge = "subjectpurge.cli:app"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/subjectpurge"
Repository = "https://github.com/SuperMarioYL/subjectpurge"
Issues = "https://github.com/SuperMarioYL/subjectpurge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/subjectpurge"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "README.en.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["assets", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.*",
    "ignore::DeprecationWarning:pydantic.*",
]
