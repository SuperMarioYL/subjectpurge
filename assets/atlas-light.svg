<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：CLI → Scanner·Adapters → Audit signer">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- connectors: 底层静线 + 顶层行军虚线(数据流) + animateMotion 数据包 -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="210" y1="180" x2="355" y2="180" marker-end="url(#ah-l)"/>
    <line x1="525" y1="180" x2="670" y2="180" marker-end="url(#ah-l)"/>
  </g>
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="180" x2="349" y2="180" stroke="#FF3B30" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="525" y1="180" x2="664" y2="180" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
  </g>
  <g>
    <circle r="3" fill="#FF3B30">
      <animateMotion path="M210,180 L349,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M525,180 L664,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes: CLI(red,删除触发) → Scanner·适配器(purple,agent记忆) → Audit签名(green,proof) -->
  <g>
    <rect x="40" y="140" width="170" height="80" rx="15" fill="#FF3B30" fill-opacity="0.10" stroke="#FF3B30" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#B82B22">CLI</text>
    <text x="125" y="198" text-anchor="middle" font-size="11" font-weight="500" fill="#8E2520">scan · purge · audit · verify</text>

    <rect x="355" y="140" width="170" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">扫描器 · 适配器</text>
    <text x="440" y="198" text-anchor="middle" font-size="11" font-weight="500" fill="#42379E">SQLite · Chroma · Trace</text>

    <rect x="670" y="140" width="170" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#0B6B53">Audit 签名</text>
    <text x="755" y="198" text-anchor="middle" font-size="11" font-weight="500" fill="#0A8765">ed25519 · 等保2.0</text>
  </g>

  <text x="440" y="306" text-anchor="middle" font-size="13" font-weight="500" fill="#6E6E73">反向溯源：locate → purge → signed audit（recall → delete，per-subject）</text>
</svg>
