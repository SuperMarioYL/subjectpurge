name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist into dist/
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Generate checksums
        run: |
          cd dist && sha256sum *.whl *.tar.gz > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Opt-in PyPI trusted publishing. A fresh repo has no Trusted Publisher
  # registered, so this job is skipped until the repo sets PYPI_PUBLISH=true
  # and configures the Trusted Publisher (document the one-time step in
  # BUILD_SETUP_NEXT_STEPS.md — never let an always-on job fail the release).
  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
